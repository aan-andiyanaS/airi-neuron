# GitHub Actions CI for AIRI Phase 1
#
# Scope: Kotlin unit tests + lint only.
# JNI/C++ (GoogleTest) tests require physical device (S20 Ultra) — run manually.
# NDK is set up here so the project can parse CMakeLists.txt for future tasks.
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          # NDK r25c — pinned for reproducibility (see 06_Dependencies.md when created)
          ndk-version: 25.2.9519653
          cmdline-tools-version: 11076708

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run Kotlin unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: app/build/reports/coverage/**/*.xml
        continue-on-error: true  # Non-blocking — coverage upload failure should not fail CI
